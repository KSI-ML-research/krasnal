[package]
name = "krasnal-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
csv = "1.3"
pgn-reader = "0.28.0"
polars = { version = "0.53.0", features = ["lazy", "parquet", "strings", "performant", "dtype-struct"] }
reqwest = { version = "0.13.2", features = ["blocking"] }
shakmaty = "0.29.4"
zstd = "0.13.3"
indicatif = "0.18.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "download-games"
path = "scripts/download_games.rs"

[[bin]]
name = "prepare_puzzles"
path = "src/prepare_puzzles.rs"
