repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml


  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: pytest
        name: Run Python tests
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust Format (cargo fmt)
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

      - id: cargo-clippy
        name: Rust Lint (cargo clippy)
        entry: cargo clippy --
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

      - id: cargo-test
        name: Run Rust tests
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]
