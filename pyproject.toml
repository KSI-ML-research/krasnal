[project]
name = "krasnal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bulletchess>=0.4.0",
    "chess>=1.11.2",
    "datasets>=4.5.0",
    "nbqa>=1.9.1",
    "notebook>=7.5.3",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "polars>=1.38.1",
    "pyarrow>=23.0.0",
    "pytest>=7.0.0",
    "ruff>=0.15.1",
    "tiktoken>=0.12.0",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.1.0",
    "wandb>=0.25.0",
]

[tool.pytest.ini_options]
# Suppress chess library deprecation warning for Python 3.16 compatibility
pythonpath = "."
filterwarnings = [
    "ignore:'asyncio.DefaultEventLoopPolicy' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
cache-dir = ".ruff_cache"
extend-include = ["*.ipynb"]


[tool.ruff.lint]
#syntax and runtime errors; logical errors; bug-risk; warnings; imports; pyupgrade; unused arguments
select = ["E", "F", "B", "W", "I", "UP", "ARG"]
fixable = ["ALL"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
