##based on https://github.com/lichess-bot-devs/lichess-bot/wiki/Configure-lichess-bot
token: "TOKEN_PLACEHOLDER"
url: "https://lichess.org/"

engine:
  protocol: "uci"
  interpreter: "ENGINE_INTERPRETER_PLACEHOLDER"
  name: "src/krasnal/uci_engine/run.py"
  dir: ".."
  # lichess-bot: ``true`` here means stderr is *shown* (``false`` sends engine stderr to /dev/null).
  silence_stderr: true

challenge:
  concurrency: 8
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
    - bullet
  modes:
    - casual
    - rated
  accept_bot: true

greeting:
  hello: Hi, {opponent}! I'm {me}. Good luck!
  goodbye: Good game!
  hello_spectators: "Hi! I'm {me}. Type !help for a list of commands I can respond to."
  goodbye_spectators: "Thanks for watching!"

matchmaking:
  allow_matchmaking: true
  allow_during_games: true
  challenge_initial_time:
    - 60
    - 180
  challenge_increment:
    - 1
    - 2
