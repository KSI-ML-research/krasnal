defaults:
  - _self_

learning_rate: 5e-4
min_lr: 5e-5
epochs: 1.0
warmup_iters: 100
batch_size: 64
num_workers: 4
pin_memory: false
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
optimizer: adamw  # "adamw" or "muon"
muon_lr: 0.02
muon_momentum: 0.95
log_interval: 10
eval_interval: 20000
eval_num_games: 1000
compile: false
compile_mode: default
compile_dynamic: false
compile_fullgraph: false
