defaults:
  - _self_
  - pipeline

# Target number of games to collect
target_games: 1_000_000

# Minimum Elo for both players
min_elo: 1500

# Minimum base time in seconds (5+0 = 300)
min_time: 300

# Compression level: low, medium, or high
compression: high

require_evals: false

# Inclusive month range (YYYY-MM)
start_month: "2017-04"
end_month: null

# Maia-style eval holdout (same 100-pt Elo bin, time-pressure); applied at filter time.
eval:
  month: "2019-12"
  games_per_bin: 10000
  min_clock: 30
