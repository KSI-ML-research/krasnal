defaults:
  - _self_
  - pipeline

# Target number of games to collect
target_games: 1_000_000

# Training Elo range for both players.
min_elo: 1100
max_elo: null

# Minimum Lichess estimated duration in seconds:
# initial time + 40 * increment. 180 excludes bullet and keeps blitz+.
min_estimated_duration: 180

# Number of games decoded per DuckDB query before move_details/UNNEST.
filter_chunk_games: 250_000

# Compression level: low, medium, or high
compression: high

# Inclusive month range (YYYY-MM)
start_month: "2017-04"
end_month: null

# Maia-style eval holdout (same 100-pt Elo bin, time-pressure); applied at filter time.
eval:
  month: "2019-12"
  games_per_bin: 10000
  min_elo: 1100
