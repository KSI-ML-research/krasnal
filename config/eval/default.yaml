defaults:
  - _self_

enable_qa_check_metrics: true
enable_piece_probe_metrics: true
# Keep false for cleaner W&B unless you want per-piece F1 breakdowns.
enable_piece_f1_breakdown_metrics: false
# Enables qa_check_tp, qa_check_fp, qa_check_tn, qa_check_fn.
# Keep false for cleaner W&B unless debugging confusions.
enable_qa_check_confusion_matrix_metrics: false
# Enables 36 extra counters: piece_cm_<true_piece>_<pred_piece>.
# Keep false for cleaner W&B unless debugging class confusions.
enable_piece_confusion_matrix_metrics: false

metrics:
  - acc
  - acc_opening
  - acc_middlegame
  - acc_endgame
  - acc_when_gives_check
  - acc_when_in_check

  - illegal_mass
  # - illegal_mass_opening
  # - illegal_mass_middlegame
  # - illegal_mass_endgame
  - illegal_mass_when_gives_check
  - illegal_mass_when_in_check

  - acpl
  - blunder_rate
  - mrr
  - stockfish_top1

  # - target_piece_acc
  # - target_piece_top1_legal

  - top1_legal
  - top1_legal_opening
  - top1_legal_middlegame
  - top1_legal_endgame
  # - top1_legal_when_gives_check
  - top1_legal_when_in_check

cot_metrics:
  - cot_format_valid
  - cot_post_think_mrr
  - cot_post_think_top1_legal
  - cot_post_think_top1
  - cot_think_token_recall

stockfish_depth: 10
acpl_sample_size: 100
