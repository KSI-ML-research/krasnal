defaults:
  - pipeline
  - _self_

# Task-specific sampling probabilities
qa:
  check:
    enabled: true
    prob: 0.5
  what_is_on:
    enabled: true
    prob: 0.1
    baseline:
      enabled: true
      max_games: 100000



time_control:
  enabled: true

outcome_conditioning:
  enabled: true

preprocess_workers: 2
# How many tokenized part_*.parquet shards to group per shuffle batch (pack one shard at a time).
preprocess_concat_batch_size: 10
# Spill packed training windows to disk every N rows per worker (bounds RAM).
pack_flush_windows: 100000
# Read tokenized training parts in bounded batches while packing.
pack_stream_batch_size: 10000
