defaults:
  - pipeline
  - _self_

# Task-specific sampling probabilities
qa:
  check:
    enabled: true
    prob: 0.5
  what_is_on:
    enabled: true
    prob: 0.1
    baseline:
      enabled: true
      max_games: 100000

time_control_token:
  enabled: true

outcome_conditioning:
  enabled: true

# Optional training-data cap for quick ablations. Takes the first N training games
# from sorted filtered shards; null means all available training games.
target_games: null

preprocess_workers: 2
# Spill packed training windows to disk every N rows per worker (bounds RAM).
pack_flush_windows: 100000
# Games per PyArrow batch while streaming a filtered shard.
pack_stream_batch_size: 10000

# Token-mix, sequence stats, wandb, clock report, eval Elo bins (off by default for speed).
report:
  enabled: true
