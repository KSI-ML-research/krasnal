defaults:
  - pipeline
  - _self_

# Task-specific sampling probabilities
qa:
  check:
    enabled: true
    prob: 0.5
  what_is_on:
    enabled: true
    prob: 0.1



time_control:
  enabled: true

preprocess_workers: 4
# Merge this many part_*.parquet shards at a time when writing train/eval (avoids high RAM use).
preprocess_concat_batch_size: 10
