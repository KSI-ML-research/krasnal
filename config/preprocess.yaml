defaults:
  - pipeline
  - _self_

# Task-specific sampling probabilities
qa:
  check:
    enabled: true
    prob: 0.5
  what_is_on:
    enabled: true
    prob: 0.1



time_control:
  enabled: true

preprocess_workers: 4
# How many tokenized part_*.parquet shards to group per shuffle batch (pack one shard at a time).
preprocess_concat_batch_size: 10
# Spill packed training windows to disk every N rows while preprocessing (bounds RAM).
pack_flush_windows: 8000
