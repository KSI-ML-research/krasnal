defaults:
  - _self_

# Toggles for various evaluation probes
qa:
  check:
    enabled: true
    confusion_matrix: false
  what_is_on:
    enabled: true
    accuracy_per_square: true
    # Set to e.g. data/2_tokenized/what_is_on_baseline_counts.json after running
    # scripts/data/build_what_is_on_baseline_counts.py
    baseline_counts_path: null

# List of classical metrics to compute
metrics:
  - acc
  - acc_opening
  - acc_middlegame
  - acc_endgame
  - acc_when_gives_check
  - acc_when_in_check
  - acc_when_low_time
  - acc_elo_below_1000
  - acc_elo_1000_1099
  - acc_elo_1100_1199
  - acc_elo_1200_1299
  - acc_elo_1300_1399
  - acc_elo_1400_1499
  - acc_elo_1500_1599
  - acc_elo_1600_1699
  - acc_elo_1700_1799
  - acc_elo_1800_1899
  - acc_elo_1900_1999
  - acc_elo_2000_2099
  - acc_elo_2100_2199
  - acc_elo_above_2200

  - illegal_mass
  - illegal_mass_opening
  - illegal_mass_middlegame
  - illegal_mass_endgame
  - illegal_mass_when_gives_check
  - illegal_mass_when_in_check
  - illegal_mass_when_low_time

  - mrr
  - mrr_when_low_time
  # - target_piece_acc
  # - target_piece_top1_legal

  - top1_legal
  - top1_legal_opening
  - top1_legal_middlegame
  - top1_legal_endgame
  - top1_legal_when_gives_check
  - top1_legal_when_in_check
  - top1_legal_when_low_time

# Mover clock threshold (seconds) for *_when_low_time metrics
low_time_seconds: 30
