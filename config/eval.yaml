defaults:
  - _self_

# Toggles for various evaluation probes
qa:
  max_positions: 10000
  check:
    enabled: true
    confusion_matrix: false
  what_is_on:
    enabled: true
    accuracy_per_square: true
    baseline_counts_path: ${oc.env:KRASNAL_TOKENIZED_DIR,data/2_tokenized}/what_is_on_baseline_counts.json

# null means use train.batch_size
inference_batch_size: null

# Maia-style position filter for move metrics.
min_ply: 10
min_active_clock: 30

# List of classical metrics to compute
metrics:
  - acc
  - acc_opening
  - acc_middlegame
  - acc_endgame
  - acc_when_gives_check
  - acc_when_in_check
  - mrr
  - top1_legal
  - acc_elo_1100_1199
  - acc_elo_1200_1299
  - acc_elo_1300_1399
  - acc_elo_1400_1499
  - acc_elo_1500_1599
  - acc_elo_1600_1699
  - acc_elo_1700_1799
  - acc_elo_1800_1899
  - acc_elo_1900_1999
  - acc_elo_2000_2099
  - acc_elo_2100_2199
  - acc_elo_above_2200
