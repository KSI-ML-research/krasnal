defaults:
  - _self_

# Toggles for various evaluation probes
qa:
  check:
    enabled: true
    confusion_matrix: false
  piece_type_moved:
    enabled: true
    f1_per_piece: false
    confusion_matrix: false
  what_is_on:
    enabled: true
    accuracy_per_square: true

# List of classical metrics to compute
metrics:
  - acc
  - acc_opening
  - acc_middlegame
  - acc_endgame
  - acc_when_gives_check
  - acc_when_in_check
  - acc_elo_below_1000
  - acc_elo_1000_1499
  - acc_elo_1500_1999
  - acc_elo_2000_2499
  - acc_elo_2500_2999
  - acc_elo_above_3000

  - illegal_mass
  - illegal_mass_opening
  - illegal_mass_middlegame
  - illegal_mass_endgame
  - illegal_mass_when_gives_check
  - illegal_mass_when_in_check

  - acpl
  - blunder_rate
  - mrr
  - stockfish_top1

  # - target_piece_acc
  # - target_piece_top1_legal

  - top1_legal
  - top1_legal_opening
  - top1_legal_middlegame
  - top1_legal_endgame
  - top1_legal_when_gives_check
  - top1_legal_when_in_check

# Metrics specifically for Chain-of-Thought (CoT) runs
cot_metrics:
  - cot_format_valid
  - cot_post_think_mrr
  - cot_post_think_top1_legal
  - cot_post_think_top1
  - cot_think_token_recall

# Stockfish-based evaluation settings
stockfish:
  depth: 10
  acpl_sample_size: 100
