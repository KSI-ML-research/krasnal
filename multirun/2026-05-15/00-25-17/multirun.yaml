hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - +pretrain_input=data/1_filtered_clocked_only/filtered_2019-01_clk_only.parquet
    - +eval_input=data/1_filtered_clocked_only/filtered_2019-01_clk_only.parquet
    - +xgboost_output_dir=data/3_xgboost
  job:
    name: build_xgboost_table
    chdir: null
    override_dirname: +eval_input=data/1_filtered_clocked_only/filtered_2019-01_clk_only.parquet,+pretrain_input=data/1_filtered_clocked_only/filtered_2019-01_clk_only.parquet,+xgboost_output_dir=data/3_xgboost
    id: ???
    num: ???
    config_name: preprocess
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/szymka/uwr/kml/krasnal
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/szymka/uwr/kml/krasnal/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
seed: 42
side_prefixed_moves: true
block_size: 256
padding_bucket_sizes:
- 64
- 128
- 192
- 256
wandb_project: krasnal
input_dir: data/1_filtered
include_check_qa: true
include_piece_qa: true
piece_qa:
  king_base_prob: 0.1
unknown_elo:
  normal_prob: 0.97
  white_unknown_prob: 0.01
  black_unknown_prob: 0.01
  both_unknown_prob: 0.01
preprocess_workers: 0
pretrain_input: data/1_filtered_clocked_only/filtered_2019-01_clk_only.parquet
eval_input: data/1_filtered_clocked_only/filtered_2019-01_clk_only.parquet
xgboost_output_dir: data/3_xgboost
